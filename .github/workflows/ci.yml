name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # rust-toolchain.toml pins the version, and its "default" profile brings
    # rustfmt and clippy with it.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - run: cargo fmt --check
    - run: cargo clippy --all-targets --locked -- -D warnings
    - run: cargo test --locked

  launcher:
    name: npm launcher (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines.node` promises, and the current release. Leaving
        # the runtime unpinned would let the promise drift out of test.
        node: ['20.19', '24']
    steps:
    - name: Checkout Commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install pnpm
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
      with:
        version: 11
        runtime: node@${{ matrix.node }}
        install: false
    # The glob is expanded by the shell, not by `node --test`, whose own glob
    # support is newer than the floor above.
    - run: node --test npm/xray/test/*.test.mjs
